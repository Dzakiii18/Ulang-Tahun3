<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Bot*</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            position: relative;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }

        .backrgound {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1; /* Place behind everything */
        }

        main {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .birthday-content {
            padding: 20px;
            max-width: 600px;
            margin-top: 80px;
            z-index: 2;
        }

        h1 {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #D6A6D2;
            line-height: 1.1;
            margin-left: 50px;
        }

        .date {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #F5B4A2;
            margin-left: 50px;
        }

        .umur {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #F5B4A2;
            margin-left: 50px;
        }

        .birthday-image {
            position: absolute;
            top: 20%;
            right: 10%;
            width: 300px;
            height: 400px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 3;
        }

        .foto-depan {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            position: relative;
            z-index: 2;
        }

        .content-order {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .button {
            width: 296px;
            height: 58px;
            border-radius: 29px;
            background: linear-gradient(135deg, #ff6b6b, #F5B4A2);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 20;
            color: rgba(214, 166, 210, 1);
        }

        .button:hover {
            transform: scale(1.1);
            background-color: #333;
        }

        .button-text {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
        }

        .balloons-container {
            position: fixed;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            z-index: 1;
            pointer-events: none;
        }

        .balloon {
            position: absolute;
            width: 80px;
            transition: transform 0.3s ease;
            cursor: pointer;
            pointer-events: auto;
            z-index: 1;
        }

        /* Initial positions for balloons */
        .balloon-left {
            left: 10%;
            bottom: 10%;
            animation: float1 8s infinite ease-in-out;
        }

        .balloon-middle {
            left: 50%;
            transform: translateX(-50%);
            bottom: 5%;
            animation: float2 12s infinite ease-in-out;
        }

        .balloon-right {
            right: 10%;
            bottom: 15%;
            animation: float3 10s infinite ease-in-out;
        }

        .balloon-top.right {
            right: 20%;
            top: 10%;
            animation: float4 11s infinite ease-in-out;
        }

        .balloon-bottom.left {
            left: 20%;
            bottom: 20%;
            animation: float5 9s infinite ease-in-out;
        }

        /* Floating animations for balloons */
        @keyframes float1 {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(20px, -30px) rotate(5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        @keyframes float2 {
            0% { transform: translate(-50%, 0) rotate(0deg); }
            50% { transform: translate(-40%, -40px) rotate(-5deg); }
            100% { transform: translate(-50%, 0) rotate(0deg); }
        }

        @keyframes float3 {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-30px, -20px) rotate(8deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        @keyframes float4 {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-15px, 25px) rotate(-8deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        @keyframes float5 {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(25px, -15px) rotate(5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .hidden-audio {
            display: none;
        }

        /* Pop animation for balloons */
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            30% { transform: scale(1.2); }
            100% { transform: scale(0); opacity: 0; }
        }

        .popping {
            animation: pop 0.5s forwards;
        }

        /* Welcome overlay styles */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .welcome-container {
            background: linear-gradient(135deg, #ff6b6b, #F5B4A2);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 90%;
            transform: scale(0.9);
            animation: pulse 2s infinite alternate;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        .welcome-title {
            font-size: 2.5rem;
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .welcome-button {
            background-color: white;
            color: #ff6b6b;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .welcome-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        /* Audio control button */
        .audio-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: rgba(255, 107, 107, 0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .audio-control:hover {
            transform: scale(1.1);
        }

        .audio-icon {
            color: white;
            font-size: 24px;
        }

        /* Responsive design */
        @media (max-width: 992px) {
            h1 {
                font-size: 3rem;
            }
            
            .birthday-image {
                position: relative;
                top: 0;
                right: 0;
                margin: 20px auto;
            }
            
            .birthday-content {
                margin-top: 20px;
                text-align: center;
                margin-left: auto;
                margin-right: auto;
            }
            
            .welcome-title {
                font-size: 2rem;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
                margin-left: 20px;
            }
            
            .date, .umur {
                margin-left: 20px;
            }
            
            .birthday-image {
                width: 250px;
                height: 333px;
            }
            
            .welcome-container {
                padding: 30px;
            }
            
            .welcome-title {
                font-size: 1.8rem;
            }
            
            .welcome-button {
                padding: 12px 24px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
                margin-left: 10px;
            }
            
            .date, .umur {
                font-size: 1.2rem;
                margin-left: 10px;
            }
            
            .birthday-image {
                width: 200px;
                height: 267px;
            }
            
            .button {
                width: 150px;
                height: 50px;
            }
            
            .button-text {
                font-size: 1rem;
            }
            
            .balloon {
                width: 60px;
            }
            
            .welcome-container {
                padding: 20px;
            }
            
            .welcome-title {
                font-size: 1.5rem;
            }
            
            .welcome-button {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Welcome Overlay -->
    <div class="welcome-overlay" id="welcomeOverlay">
        <div class="welcome-container">
            <h2 class="welcome-title">Selamat Ulang Tahun!</h2>
            <button class="welcome-button" id="startButton">Mulai</button>
        </div>
    </div>

    <img class="backrgound" src="background 2.png" alt="">
    
    <main>
        <div class="birthday-content">
            <h1>Fadlan<br>Selamat Ulang Tahun</h1>
            <p class="date">Sabtu | 3 Mei, 2025</p>
            <p class="umur">Yang Ke Berapa Hayo?</p>
        </div>
        
        <!-- Audio element without autoplay -->
        <audio id="bgMusic" preload="auto">
            <source src="happy-birthday-322777.mp3" type="audio/mpeg">
        </audio>
        
        <div class="container">
            <div class="content-order">
                <!-- Tombol di tengah -->
                <button class="button" onclick="celebrateAndNavigate()">
                    <p class="button-text">Klik<br>Disini</p>
                </button>
            </div>
        </div>
    
        <div class="birthday-image">
            <img class="foto-depan" src="foto sampul.JPG" alt="Person celebrating birthday with gift">
        </div>
        
        <!-- Balon di bawah -->
        <div class="balloons-container">
            <img id="balloon1" class="balloon balloon-left" src="balon blue.png" alt="blue Balloon" onclick="popBalloon('balloon1')">
            <img id="balloon2" class="balloon balloon-middle" src="balon oren.png" alt="Orange Balloon" onclick="popBalloon('balloon2')">
            <img id="balloon3" class="balloon balloon-right" src="balon pink.png" alt="Pink Balloon" onclick="popBalloon('balloon3')">
            <img id="balloon4" class="balloon balloon-top right" src="balon ungu.png" alt="purple 1 Balloon" onclick="popBalloon('balloon4')">
            <img id="balloon5" class="balloon balloon-bottom left" src="balon ungu2.png" alt="purple 2 Balloon" onclick="popBalloon('balloon5')">
        </div>
        
        <!-- Audio control button -->
        <div class="audio-control" id="audioControl">
            <div class="audio-icon">▶️</div>
        </div>
    </main>

    <script>
        // Get DOM elements
        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const startButton = document.getElementById('startButton');
        const bgMusic = document.getElementById('bgMusic');
        const audioControl = document.getElementById('audioControl');
        const audioIcon = document.querySelector('.audio-icon');
        
        // Set initial audio state
        let isPlaying = false;
        
        // Function to play audio
        function playAudio() {
            bgMusic.play().then(() => {
                isPlaying = true;
                audioIcon.innerHTML = '❚❚';
            }).catch(error => {
                console.error('Audio play failed:', error);
                alert('Gagal memutar musik. Silakan klik tombol play di pojok kanan bawah.');
            });
        }
        
        // Function to pause audio
        function pauseAudio() {
            bgMusic.pause();
            isPlaying = false;
            audioIcon.innerHTML = '▶️';
        }
        
        // Add click event to audio control button
        audioControl.addEventListener('click', function() {
            if (isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        });
        
        // Start button click handler
        startButton.addEventListener('click', function() {
            // Hide welcome overlay with fade effect
            welcomeOverlay.style.opacity = '0';
            
            // Try to play music
            playAudio();
            
            // Remove overlay from DOM after fade animation
            setTimeout(() => {
                welcomeOverlay.style.display = 'none';
            }, 500);
            
            // Show balloons with staggered delay
            showBalloonsWithDelay();
        });
        
        // Function to show balloons with staggered delay
        function showBalloonsWithDelay() {
            const balloons = document.querySelectorAll('.balloon');
            
            balloons.forEach((balloon, index) => {
                setTimeout(() => {
                    balloon.style.opacity = '1';
                }, index * 200);
            });
        }

        // Function to make balloons pop when clicked
        function popBalloon(id) {
            const balloon = document.getElementById(id);
            balloon.classList.add('popping');
            
            // Play pop sound (optional)
            const popSound = new Audio('pop.mp3');
            popSound.play().catch(e => console.log('Pop sound error:', e));
            
            // Remove the balloon after animation
            setTimeout(() => {
                balloon.style.display = 'none';
            }, 500);
        }

        // Create random movement for balloons
        function randomizeBalloons() {
            const balloons = document.querySelectorAll('.balloon');
            
            balloons.forEach(balloon => {
                // Set initial opacity to 0
                balloon.style.opacity = '0';
                
                // Get random position
                const randomX = Math.random() * 80; // 0-80% of screen width
                const randomY = Math.random() * 80; // 0-80% of screen height
                
                // Get random size between 60px and 100px
                const randomSize = 60 + Math.random() * 40;
                
                // Set random position and size
                balloon.style.left = `${randomX}%`;
                balloon.style.top = `${randomY}%`;
                balloon.style.width = `${randomSize}px`;
                
                // Set random animation duration
                const animDuration = 5 + Math.random() * 10;
                balloon.style.animationDuration = `${animDuration}s`;
            });
        }

        // Function to celebrate and navigate to ketik.html
        function celebrateAndNavigate() {
            // Show celebration effect
            const button = document.querySelector('.button');
            button.style.transform = 'scale(1.2)';
            
            // Add more balloons for celebration effect
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    addExtraBalloon();
                }, i * 300);
            }
            
            // Navigate to ketik.html after a short delay
            setTimeout(() => {
                window.location.href = 'ketik.html';
            }, 1500); // 1.5 second delay before navigation
        }

        // Function to add extra balloons
        function addExtraBalloon() {
            const colors = ['balon blue.png', 'balon oren.png', 'balon pink.png', 'balon ungu.png', 'balon ungu2.png'];
            const container = document.querySelector('.balloons-container');
            
            const newBalloon = document.createElement('img');
            newBalloon.className = 'balloon';
            newBalloon.src = colors[Math.floor(Math.random() * colors.length)];
            newBalloon.alt = 'Balloon';
            newBalloon.style.left = `${Math.random() * 90}%`;
            newBalloon.style.top = `${Math.random() * 90}%`;
            newBalloon.style.width = `${60 + Math.random() * 40}px`;
            newBalloon.style.animation = `float${Math.floor(Math.random() * 5) + 1} ${8 + Math.random() * 4}s infinite ease-in-out`;
            newBalloon.style.opacity = '1';
            
            // Add click event to pop
            newBalloon.onclick = function() {
                this.classList.add('popping');
                const popSound = new Audio('pop.mp3');
                popSound.play().catch(e => console.log('Pop sound error:', e));
                setTimeout(() => {
                    this.style.display = 'none';
                }, 500);
            };
            
            container.appendChild(newBalloon);
        }
        
        // Enable audio for iOS devices specifically
        document.body.addEventListener('touchstart', function() {
            if (bgMusic.paused && !isPlaying) {
                // Just prepare the audio context, don't auto-play
                bgMusic.load();
            }
        }, {once: true});

        // Initialize random balloon positions
        window.onload = function() {
            // Wait a bit before randomizing to ensure all elements are loaded
            setTimeout(randomizeBalloons, 500);
            
            // Hide the audio control initially
            audioControl.style.display = 'none';
            
            // Show audio control after welcome screen is closed
            startButton.addEventListener('click', function() {
                setTimeout(() => {
                    audioControl.style.display = 'flex';
                }, 500);
            });
        };
    </script>
</body>
</html>
